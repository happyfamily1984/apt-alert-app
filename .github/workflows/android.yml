# 안드로이드 APK 자동 빌드 (PC 없이 GitHub 서버에서 빌드)
# - 코드가 바뀌면 자동 실행, 또는 Actions 탭에서 "Run workflow"로 수동 실행
# - 저장소 Secrets에 서명키(ANDROID_KEYSTORE_BASE64 등)가 있으면 같은 서명으로 빌드해
#   Releases에 올림 → 휴대폰에서 기존 앱 위에 바로 업데이트 설치 가능
name: Android APK

on:
  push:
    paths: ['android/**', 'public/**', 'shared/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: 서명키 준비 (Secrets가 있을 때만)
        id: sign
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_STOREFILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::서명키 Secret이 없어 디버그 키로 서명합니다 (Releases에는 올리지 않음)"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 테스트 & APK 빌드
        working-directory: android
        env:
          ANDROID_STOREPASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEYPASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEYALIAS: aptalert
          # 기본 중계 서버 주소(저장소 Variables: PROXY_URL)를 APK에 넣음 → 사용자는 설치만 하면 바로 사용
          PROXY_URL: ${{ vars.PROXY_URL }}
          PROXY_TOKEN: ${{ secrets.PROXY_TOKEN }}
        run: |
          # 버전 코드·이름은 app/build.gradle.kts 의 값 사용 (Play 업로드 순서와 맞추기 위해)
          VERSION_NAME=$(grep -oP 'VERSION_NAME"\) \?: "\K[^"]+' app/build.gradle.kts)
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          chmod +x gradlew
          ./gradlew testReleaseUnitTest assembleRelease bundleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/apt-alert-$VERSION_NAME.apk"
          cp app/build/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/apt-alert-$VERSION_NAME.aab"

      - uses: actions/upload-artifact@v4
        with:
          name: apt-alert-${{ env.VERSION_NAME }}
          path: |
            ${{ runner.temp }}/apt-alert-*.apk
            ${{ runner.temp }}/apt-alert-*.aab

      - name: Releases에 업로드
        if: steps.sign.outputs.signed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}-build${{ github.run_number }}
          name: 아파트 실거래가 알리미 ${{ env.VERSION_NAME }} (빌드 ${{ github.run_number }})
          body: 휴대폰에서 아래 APK 파일을 눌러 다운로드 → 설치하세요. 기존 앱 위에 덮어 설치하면 설정·구독이 유지됩니다.
          files: |
            ${{ runner.temp }}/apt-alert-*.apk
            ${{ runner.temp }}/apt-alert-*.aab
