# 안드로이드 APK 자동 빌드 (PC 없이 GitHub 서버에서 빌드)
# - 코드가 바뀌면 자동 실행, 또는 Actions 탭에서 "Run workflow"로 수동 실행
# - 저장소 Secrets에 서명키(ANDROID_KEYSTORE_BASE64 등)가 있으면 같은 서명으로 빌드해
#   Releases에 올림 → 휴대폰에서 기존 앱 위에 바로 업데이트 설치 가능
name: Android APK

on:
  push:
    paths: ['android/**', 'public/**', 'shared/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: 서명키 준비 (Secrets가 있을 때만)
        id: sign
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_STOREFILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::서명키 Secret이 없어 디버그 키로 서명합니다 (Releases에는 올리지 않음)"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 테스트 & APK 빌드
        working-directory: android
        env:
          ANDROID_STOREPASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEYPASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEYALIAS: aptalert
        run: |
          # 직접 배포한 1.0.0(versionCode 1)보다 항상 높게
          export VERSION_CODE=$((GITHUB_RUN_NUMBER + 1))
          export VERSION_NAME="1.0.$VERSION_CODE"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          chmod +x gradlew
          ./gradlew testReleaseUnitTest assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/apt-alert-$VERSION_NAME.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: apt-alert-apk
          path: ${{ runner.temp }}/apt-alert-*.apk

      - name: Releases에 업로드
        if: steps.sign.outputs.signed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: 실거래 알리미 ${{ env.VERSION_NAME }}
          body: 휴대폰에서 아래 APK 파일을 눌러 다운로드 → 설치하세요. 기존 앱 위에 덮어 설치하면 설정·구독이 유지됩니다.
          files: ${{ runner.temp }}/apt-alert-*.apk
